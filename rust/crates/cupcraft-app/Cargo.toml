[package]
name = "cupcraft-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "cupcraft — editor de vídeo de escritorio nativo (egui/wgpu, sin WebView ni servidor)"

[dependencies]
eframe = "0.37.0"
cupcraft-core = { path = "../cupcraft-core" }
cupcraft-persist = { path = "../cupcraft-persist" }
cupcraft-audio = { path = "../cupcraft-audio" }
cupcraft-media = { path = "../cupcraft-media" }
cupcraft-tts = { path = "../cupcraft-tts" }
cupcraft-capcut = { path = "../cupcraft-capcut" }
rfd = "0.15"
serde_json = "1"
resvg = { version = "0.49", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
ab_glyph = "0.2"
cpal = "0.15"
# Compositing multihilo en la exportación: reparte los bucles por píxel del
# compositor entre todos los núcleos. Rust puro, sin privilegios de admin.
rayon = "1.12"
# Compositing en GPU (Fase B): `wgpu` headless para ejecutar los shaders de
# textura por cómputo. Mismo backend que ya usa eframe; sin privilegios de admin.
# Hay reserva en CPU (rayon) si no hay adaptador GPU disponible.
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# Matting IA (recorte de fondo): inferencia ONNX en Rust puro, sin biblioteca
# nativa ni privilegios de administrador. Ejecuta BackgroundMattingV2 (MIT).
tract-onnx = "0.23"
# Subtítulos automáticos: descarga del motor/modelo Whisper (acción del usuario).
ureq = "2.12"
# Autoactualización: verificación SHA256 de la descarga.
sha2 = "0.10"

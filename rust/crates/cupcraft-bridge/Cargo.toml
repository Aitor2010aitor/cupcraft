[package]
name = "cupcraft-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Puente HTTP en 127.0.0.1 con token para integración de agentes de IA con el editor cupcraft"

[dependencies]
cupcraft-core = { path = "../cupcraft-core" }
cupcraft-persist = { path = "../cupcraft-persist" }
serde.workspace = true
serde_json.workspace = true
rand = "0.8"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower-http = { version = "0.5", features = ["cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
